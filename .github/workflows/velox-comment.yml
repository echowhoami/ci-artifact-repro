# Mirrors facebookincubator/velox .github/workflows/selective-build-comment.yml
# step order: sparse checkout -> download-artifact (NO path:) -> source the script
name: Selective Build Comment

on:
  workflow_run:
    workflows: [Linux Build using GCC]
    types:
      - completed

permissions:
  pull-requests: write
  issues: write
  actions: read

jobs:
  post-comment:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Evidence BEFORE download
        run: |
          echo "--- trusted .github/scripts/gh-api-retry.sh ---"
          cat .github/scripts/gh-api-retry.sh

      - name: Download comment artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: selective-build-comment
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Get PR number
        id: pr
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "--- .github/scripts/gh-api-retry.sh AFTER download ---"
          cat .github/scripts/gh-api-retry.sh
          echo "--- sourcing it, exactly as velox does ---"
          source .github/scripts/gh-api-retry.sh
          pr_number=$(gh_api \
            "/repos/${REPO}/pulls?head=${HEAD_OWNER}:${HEAD_BRANCH}&state=open" \
            -q '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            echo "No open PR found for branch ${HEAD_BRANCH}"
            exit 0
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: steps.pr.outputs.number
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('comment.md', 'utf8');
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment,
            });
